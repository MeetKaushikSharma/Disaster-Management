version: '3.8'

services:
  # ── Cloud Backend API (Node.js/Express) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/disaster_db
      - JWT_SECRET=change_this_to_a_secure_random_64_byte_hex_string_in_production
      - JWT_EXPIRES_IN=7d
      - DEFAULT_BUFFER_RADIUS_KM=5
      - ADMIN_ORIGIN=http://localhost:5173
    depends_on:
      - mongo
    networks:
      - disaster_network

  # ── AI Anomaly Detection Microservice (Python/FastAPI) ───────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: disaster_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BACKEND_API_URL=http://backend:5000/api
      - SCAN_INTERVAL_SECONDS=300
      - ANOMALY_THRESHOLD=0.65
    depends_on:
      - backend
    networks:
      - disaster_network

  # ── Local MongoDB Instance ───────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: disaster_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - disaster_network

volumes:
  mongo_data:

networks:
  disaster_network:
    driver: bridge
