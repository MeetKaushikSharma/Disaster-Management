name: Scheduled Disaster Prediction & Early Warning Pipeline

on:
  schedule:
    # Runs every 3 hours (at 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      retrain:
        description: 'Retrain ML models using Open-Meteo Archive historical data before predicting'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run mode (do not commit alerts to backend database)'
        required: false
        type: boolean
        default: false

jobs:
  run-prediction-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd ai-service
          pip install -r requirements.txt

      - name: Run Model Re-training (Optional / On-Demand)
        if: ${{ inputs.retrain == true }}
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
        run: |
          cd ai-service
          python training/trainer.py --days 90

      - name: Execute AI Disaster Prediction Engine
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'http://localhost:5000/api' }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          RISK_ALERT_THRESHOLD: '0.50'
        run: |
          cd ai-service
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python predict_engine.py --dry-run
          else
            python predict_engine.py
          fi
